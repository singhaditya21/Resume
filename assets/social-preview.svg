    <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800">
      <rect x="28" y="72" width="126" height="52" rx="2" fill="#2457f5"/>
      <text x="91" y="103" text-anchor="middle" fill="#ffffff">DECISION</text>
      <rect x="186" y="72" width="126" height="52" rx="2" fill="#c8f33d"/>
      <text x="249" y="103" text-anchor="middle" fill="#10233f">VALUE</text>
      <rect x="28" y="164" width="126" height="52" rx="2" fill="#5ed5c7"/>
      <text x="91" y="195" text-anchor="middle" fill="#10233f">CONTROL</text>
      <rect x="186" y="164" width="126" height="52" rx="2" fill="#ef6a35"/>
      <text x="249" y="195" text-anchor="middle" fill="#10233f">DELIVERY</text>
    </g>

    <g fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2">
      <path d="M154 98H186"/>
      <path d="M91 124V164"/>
      <path d="M249 124V164"/>
      <path d="M154 190H186"/>
    </g>
    <circle cx="170" cy="98" r="4" fill="#fffdf8"/>
    <circle cx="91" cy="144" r="4" fill="#fffdf8"/>
    <circle cx="249" cy="144" r="4" fill="#fffdf8"/>
    <circle cx="170" cy="190" r="4" fill="#fffdf8"/>

    <rect x="28" y="254" width="284" height="44" rx="2" fill="#fffdf8" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
    <circle cx="50" cy="276" r="5" fill="#c8f33d"/>
    <text x="65" y="281" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#ffffff">EVIDENCE AT EVERY LAYER</text>
