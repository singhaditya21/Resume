<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Aditya Singh — Enterprise AI value strategy and BFSI transformation</title>
  <desc id="description">A navy portfolio card connecting strategy, governed architecture, delivery and evidence.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#203653"/>
      <stop offset="1" stop-color="#10233f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#10233f"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="0" y="0" width="12" height="630" fill="#c8f33d"/>
  <circle cx="1130" cy="66" r="160" fill="#2457f5" opacity="0.16"/>
  <circle cx="1080" cy="560" r="210" fill="#5ed5c7" opacity="0.08"/>

  <g transform="translate(64 54)">
    <rect width="62" height="62" rx="3" fill="#c8f33d"/>
    <text x="31" y="40" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#10233f">AS</text>
    <text x="82" y="24" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" letter-spacing="0.4" fill="#fffdf8">Aditya Singh</text>
    <text x="82" y="48" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.4" fill="#5ed5c7">ENTERPRISE AI · BANKING · TRANSFORMATION</text>
  </g>

  <g transform="translate(64 175)">
