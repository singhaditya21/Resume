    <text x="0" y="72" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="800" letter-spacing="-2.8" fill="#fffdf8">implementation.</text>
    <rect x="1" y="166" width="520" height="3" fill="#2457f5"/>
    <text x="0" y="211" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-style="italic" fill="#c8f33d">Value strategy · Governed architecture · Delivery at scale</text>
    <text x="0" y="256" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#cbd4df">Technical systems, decision architecture and public build evidence</text>
    <text x="0" y="284" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#cbd4df">for complex, regulated enterprises.</text>
  </g>

  <g transform="translate(785 164)">
