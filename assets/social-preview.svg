    <text x="117" fill="#ffffff">AI SYSTEMS</text>
    <text x="250" fill="#ffffff">ARCHITECTURE</text>
    <text x="401" fill="#ffffff">BUILD EVIDENCE</text>
  </g>
  <text x="1125" y="574" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#9eacbd">SINGHADITYA21.GITHUB.IO/RESUME</text>
