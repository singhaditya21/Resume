nd-center dashboards</tspan></text><rect x="1252" y="365" width="246" height="53" rx="12" fill="#f4f8fd" stroke="#a9bfdc"/><text x="1375" y="389" text-anchor="middle" font-size="16" font-weight="700" fill="#17314f"><tspan x="1375" dy="0">Evidence-backed result</tspan></text><rect x="1252" y="438" width="246" height="53" rx="12" fill="#f4f8fd" stroke="#a9bfdc"/><text x="1375" y="462" text-anchor="middle" font-size="16" font-weight="700" fill="#17314f"><tspan x="1375" dy="0">Human review</tspan></text><rect x="1252" y="511" width="246" height="53" rx="12" fill="#f4f8fd" stroke="#a9bfdc"/><text x="1375" y="535" text-anchor="middle" font-size="16" font-weight="700" fill="#17314f"><tspan x="1375" dy="0">Operational action</tspan></text></g>
