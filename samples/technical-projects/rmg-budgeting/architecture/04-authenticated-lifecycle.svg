" font-size="14" font-weight="700" fill="#17314f"><tspan x="264" dy="0">Server-authoritative recomputation</tspan></text><rect x="456" y="712" width="316" height="48" rx="10" fill="white" stroke="#b7cae4"/><text x="614" y="733" text-anchor="middle" font-size="14" font-weight="700" fill="#17314f"><tspan x="614" dy="0">Signature-bound approval</tspan></text><rect x="806" y="712" width="316" height="48" rx="10" fill="white" stroke="#b7cae4"/><text x="964" y="733" text-anchor="middle" font-size="14" font-weight="700" fill="#17314f"><tspan x="964" dy="0">Immutable versions</tspan></text><rect x="1156" y="712" width="316" height="48" rx="10" fill="white" stroke="#b7cae4"/><text x="1314" y="733" text-anchor="middle" font-size="14" font-weight="700" fill="#17314f"><tspan x="1314" dy="0">Customer samples excluded</tspan></text></g>
