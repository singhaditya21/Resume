<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Autonomous AI SQL Assistant architecture</title><desc id="desc">Target architecture and roadmap</desc>
<defs><linearGradient id="header" x1="0" x2="1"><stop stop-color="#071b38"/><stop offset="1" stop-color="#0b5bd3"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity=".13"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#173c78"/></marker><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#d9e3f0" stroke-width="1"/></pattern></defs>
<rect width="1600" height="900" fill="#f5f8fc"/><rect width="1600" height="900" fill="url(#grid)" opacity=".35"/>
<rect width="1600" height="126" fill="url(#header)"/><text x="70" y="58" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="800" fill="white">AUTONOMOUS AI SQL ASSISTANT</text><text x="70" y="96" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600" fill="#63e6be">Target architecture and roadmap</text>
<rect x="1210" y="35" width="320" height="48" rx="24" fill="#ffffff" opacity=".98"/><text x="1370" y="65" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#0b5bd3">SOURCE-BACKED PROTOTYPE</text>
<g font-family="Inter,Arial,sans-serif"><text x="70" y="177" font-size="20" font-weight="800" fill="#0b5bd3">TARGET ARCHITECTURE AND DELIVERY ROADMAP</text><rect x="72" y="220" width="455" height="510" rx="22" fill="white" stroke="#b7cae4" filter="url(#shadow)"/><rect x="72" y="220" width="455" height="78" rx="22" fill="#0b5bd3"/><text x="299" y="267" text-anchor="middle" font-size="20" font-weight="850" fill="white">CURRENT EVIDENCE</text><circle cx="124" cy="358" r="18" fill="#63e6be"/><text x="124" y="364" text-anchor="middle" font-size="15" font-weight="850" fill="#17314f">1</text><text x="160" y="349" text-anchor="start" font-size="17" font-weight="720" fill="#17314f"><tspan x="160" dy="0">Express query API</tspan></text><circle cx="124" cy="446" r="18" fill="#63e6be"/><text x="124" y="452" text-anchor="middle" font-size="15" font-weight="850" fill="#17314f">2</text><text x="160" y="437" text-anchor="start" font-size="17" font-weight="720" fill="#17314f"><tspan x="160" dy="0">Intent and retrieval agents</tspan></text><circle cx="124" cy="534" r="18" fill="#63e6be"/><text x="124" y="540" text-anchor="middle" font-size="15" font-weight="850" fill="#17314f">3</text><text x="160" y="525" text-anchor="start" font-size="17" font-weight="720" fill="#17314f"><tspan x="160" dy="0">SQL and analyst agents</tspan></text><circle cx="124" cy="622" r="18" fill="#63e6be"/><text x="124" y="628" text-anchor="middle" font-size="15" font-weight="850" fill="#17314f">4</text><text x="160" y="613" text-anchor="start" font-size="17" font-weight="720" fill="#17314f"><tspan x="160" dy="0">MCP server</tspan></text><line x1="535" y1="475" x2="567" y2="475" stroke="#173c78" stroke-width="4" marker-end="url(#arrow)"/><rect x="577" y="220" width="455" height="510" rx="22" fill="white" stroke="#b7cae4" filter="url(#shadow)"/><rect x="577" y="220" width="455" height="78" rx="22" fill="#0b5bd3"/><text x="804" y="267" text-anchor="middle" font-size="20" font-weight="850" fill="white">HARDEN &amp; PRODUCTIZE</text><circle cx="629" cy="358" r="18" fill="#63e6be"/><text x="629" y="364" text-anchor="middle" font-size="15" font-weight="850" fill="#17314f">1</text><text x="665" y="349" text-anchor="start" font-size="17" font-weight="720" fill="#17314f"><tspan x="665" dy="0">Both environment files excluded</tspan></text><circle cx="629" cy="446" r="18" fill="#63e6be"/><text x="629" y="452" text-anchor="middle" font-size="15" font-weight="850" fill="#17314f">2</text><text x="665" y="437" text-anchor="start" font-size="17" font-weight="720" fill="#17314f"><tspan x="665" dy="0">API and database credentials rotated</tspan></text><circle cx="629" cy="534" r="18" fill="#63e6be"/><text x="629" y="540" text-anchor="middle" font-size="15" font-weight="850" fill="#17314f">3</text><text x="665" y="525" text-anchor="start" font-size="17" font-weight="720" fill="#17314f"><tspan x="665" dy="0">Generated catalogs and traces</tspan><tspan x="665" dy="20">excluded</tspan></text><circle cx="629" cy="622" r="18" fill="#63e6be"/><text x="629" y="628" text-anchor="middle" font-size="15" font-weight="850" fill="#17314f">4</text><text x="665" y="613" text-anchor="start" font-size="17" font-weight="720" fill="#17314f"><tspan x="665" dy="0">Read-only SQL enforcement required</tspan></text><line x1="1040" y1="475" x2="1072" y2="475" stroke="#173c78" stroke-width="4" marker-end="url(#arrow)"/><rect x="1082" y="220" width="455" height="510" rx="22" fill="white" stroke="#b7cae4" filter="url(#shadow)"/><rect x="1082" y="220" width="455" height="78" rx="22" fill="#071b38"/><text x="1309" y="267" text-anchor="middle" font-size="20" font-weight="850" fill="#63e6be">SCALE &amp; OPERATE</text><circle cx="1134" cy="358" r="18" fill="#63e6be"/><text x="1134" y="364" text-anchor="middle" font-size="15" font-weight="850" fill="#17314f">1</text><text x="1170" y="349" text-anchor="start" font-size="17" font-weight="720" fill="#17314f"><tspan x="1170" dy="0">Multi-provider inference</tspan></text><circle cx="1134" cy="446" r="18" fill="#63e6be"/><text x="1134" y="452" text-anchor="middle" font-size="15" font-weight="850" fill="#17314f">2</text><text x="1170" y="437" text-anchor="start" font-size="17" font-weight="720" fill="#17314f"><tspan x="1170" dy="0">Text-to-SQL</tspan></text><circle cx="1134" cy="534" r="18" fill="#63e6be"/><text x="1134" y="540" text-anchor="middle" font-size="15" font-weight="850" fill="#17314f">3</text><text x="1170" y="525" text-anchor="start" font-size="17" font-weight="720" fill="#17314f"><tspan x="1170" dy="0">Schema retrieval</tspan></text><circle cx="1134" cy="622" r="18" fill="#63e6be"/><text x="1134" y="628" text-anchor="middle" font-size="15" font-weight="850" fill="#17314f">4</text><text x="1170" y="613" text-anchor="start" font-size="17" font-weight="720" fill="#17314f"><tspan x="1170" dy="0">MCP tooling</tspan></text></g>
<rect x="58" y="828" width="1484" height="48" rx="12" fill="#071b38"/><text x="800" y="859" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="750" fill="white">Move from demonstrated capability to hardened controls, measurable operations, and repeatable scale.</text>
