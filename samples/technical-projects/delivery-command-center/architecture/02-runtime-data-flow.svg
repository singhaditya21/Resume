="848" dy="0">Destructive seed route excluded</tspan></text><rect x="104" y="620" width="660" height="66" rx="13" fill="white" stroke="#c7d6e8"/><rect x="104" y="620" width="9" height="66" rx="5" fill="#7fe7dc"/><text x="138" y="649" text-anchor="start" font-size="18" font-weight="700" fill="#17314f"><tspan x="138" dy="0">Validated structured outputs</tspan></text><rect x="814" y="620" width="660" height="66" rx="13" fill="white" stroke="#c7d6e8"/><rect x="814" y="620" width="9" height="66" rx="5" fill="#7fe7dc"/><text x="848" y="649" text-anchor="start" font-size="18" font-weight="700" fill="#17314f"><tspan x="848" dy="0">Authentication and restricted CORS required</tspan></text></g>
